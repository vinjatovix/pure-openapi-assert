openapi: 3.0.3
info:
  title: Polymorphism OpenAPI Mock
  version: 1.0.0
paths:
  /test/polymorphism/anyof:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [poly]
                properties:
                  poly:
                    anyOf:
                      - type: object
                        required: [type, valA]
                        properties:
                          type:
                            type: string
                            enum: [A]
                          valA:
                            type: string
                      - type: object
                        required: [type, valB]
                        properties:
                          type:
                            type: string
                            enum: [B]
                          valB:
                            type: number

  /test/polymorphism/deprecated-anyof:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [poly]
                properties:
                  poly:
                    anyOf:
                      - type: object
                        required: [failField]
                        properties:
                          failField:
                            type: string
                          deprecatedProp:
                            type: string
                            deprecated: true
                      - type: object
                        required: [successField]
                        properties:
                          successField:
                            type: string
                          normalProp:
                            type: string
                          activeDeprecatedProp:
                            type: string
                            deprecated: true

  /test/polymorphism/oneof:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [poly]
                properties:
                  poly:
                    oneOf:
                      - type: object
                        required: [isX]
                        properties:
                          isX:
                            type: boolean
                      - type: object
                        required: [isY]
                        properties:
                          isY:
                            type: boolean

  /test/polymorphism/allof:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [poly]
                properties:
                  poly:
                    allOf:
                      - type: object
                        required: [baseField]
                        properties:
                          baseField:
                            type: string
                      - type: object
                        required: [extraField]
                        properties:
                          extraField:
                            type: number

  /test/polymorphism/ref-object:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [poly]
                properties:
                  poly:
                    anyOf:
                      - $ref: '#/components/schemas/SimpleUser'

  /test/polymorphism/discriminator:
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [poly]
                properties:
                  poly:
                    $ref: '#/components/schemas/Pet'

  /test/polymorphism/discriminator-anyof:
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [poly]
                properties:
                  poly:
                    $ref: '#/components/schemas/Vehicle'

  /test/polymorphism/discriminator-no-mapping:
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [poly]
                properties:
                  poly:
                    $ref: '#/components/schemas/Shape'

components:
  schemas:
    SimpleUser:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Pet:
      type: object
      required: [petType]
      properties:
        petType:
          type: string
      discriminator:
        propertyName: petType
        mapping:
          dog: '#/components/schemas/Dog'
          puppy: '#/components/schemas/Dog'
          cat: '#/components/schemas/Cat'
      oneOf:
        - $ref: '#/components/schemas/Dog'
        - $ref: '#/components/schemas/Cat'

    Dog:
      type: object
      required: [petType, barkVolume]
      properties:
        petType:
          type: string
          const: dog
        barkVolume:
          type: integer

    Cat:
      type: object
      required: [petType, nestsCount]
      properties:
        petType:
          type: string
          const: cat
        nestsCount:
          type: integer

    Vehicle:
      type: object
      required: [vehicleType]
      properties:
        vehicleType:
          type: string
      discriminator:
        propertyName: vehicleType
        mapping:
          car: '#/components/schemas/Car'
          truck: '#/components/schemas/Truck'
      anyOf:
        - $ref: '#/components/schemas/Car'
        - $ref: '#/components/schemas/Truck'

    Car:
      type: object
      required: [vehicleType, doors]
      properties:
        vehicleType:
          type: string
          enum: [car]
        doors:
          type: integer

    Truck:
      type: object
      required: [vehicleType, cargoCapacity]
      properties:
        vehicleType:
          type: string
          enum: [truck]
        cargoCapacity:
          type: number

    Shape:
      type: object
      required: [shape]
      properties:
        shape:
          type: string
      discriminator:
        propertyName: shape
      oneOf:
        - $ref: '#/components/schemas/Circle'
        - $ref: '#/components/schemas/Square'

    Circle:
      type: object
      required: [shape, radius]
      properties:
        shape:
          type: string
          const: Circle
        radius:
          type: number

    Square:
      type: object
      required: [shape, sideLength]
      properties:
        shape:
          type: string
          const: Square
        sideLength:
          type: number
