openapi: 3.0.3
info:
  title: Content-Type OpenAPI Mock
  version: 1.0.0
paths:
  /test/content-type/xml:
    get:
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                type: string

  /test/content-type/binary:
    get:
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string

  /test/content-type/wildcard:
    get:
      responses:
        '200':
          description: OK
          content:
            'image/*':
              schema:
                type: string
            'application/*+json':
              schema:
                type: object
                properties:
                  status:
                    type: string

  /test/no-content:
    get:
      responses:
        '204':
          description: No Content

  /test/deprecated-no-content:
    get:
      deprecated: true
      responses:
        '204':
          description: No Content

  /test/empty-content-map:
    get:
      responses:
        '200':
          description: OK
          content: {}

  /test/deprecated-route:
    get:
      deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /test/deprecated-property:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeField:
                    type: string
                  oldField:
                    type: string
                    deprecated: true
