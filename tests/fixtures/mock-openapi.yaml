openapi: 3.0.3
info:
  title: Mock API for Validator Tests
  version: 1.0.0
paths:
  /test/formats:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [uuid, email, date, dateTime, ipv4, hostname, uri]
                properties:
                  uuid:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  date:
                    type: string
                    format: date
                  dateTime:
                    type: string
                    format: date-time
                  ipv4:
                    type: string
                    format: ipv4
                  hostname:
                    type: string
                    format: hostname
                  uri:
                    type: string
                    format: uri

  /test/constraints/numbers:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [valMin, valMax, valExMin, valExMax, valMultiple]
                properties:
                  valMin:
                    type: number
                    minimum: 10
                  valMax:
                    type: number
                    maximum: 100
                  valExMin:
                    type: number
                    minimum: 5
                    exclusiveMinimum: true
                  valExMax:
                    type: number
                    maximum: 50
                    exclusiveMaximum: true
                  valMultiple:
                    type: number
                    multipleOf: 2.5

  /test/constraints/strings:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [valStr]
                properties:
                  valStr:
                    type: string
                    minLength: 3
                    maxLength: 10
                    pattern: '^[a-z]+$'

  /test/constraints/arrays:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [valArr]
                properties:
                  valArr:
                    type: array
                    minItems: 2
                    maxItems: 4
                    uniqueItems: true
                    items:
                      type: string

  /test/constraints/arrays-objects:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [valArr]
                properties:
                  valArr:
                    type: array
                    uniqueItems: true
                    items:
                      type: object

  /test/objects/strict:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                minProperties: 1
                maxProperties: 2
                properties:
                  allowedField:
                    type: string
                  anotherAllowed:
                    type: string

  /test/objects/additional-schema:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  required: [nestedVal]
                  properties:
                    nestedVal:
                      type: number
                properties:
                  declaredField:
                    type: string

  /test/polymorphism/anyof:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [poly]
                properties:
                  poly:
                    anyOf:
                      - type: object
                        required: [type, valA]
                        properties:
                          type:
                            type: string
                            enum: [A]
                          valA:
                            type: string
                      - type: object
                        required: [type, valB]
                        properties:
                          type:
                            type: string
                            enum: [B]
                          valB:
                            type: number

  /test/polymorphism/oneof:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [poly]
                properties:
                  poly:
                    oneOf:
                      - type: object
                        required: [isX]
                        properties:
                          isX:
                            type: boolean
                      - type: object
                        required: [isY]
                        properties:
                          isY:
                            type: boolean

  /test/polymorphism/allof:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [poly]
                properties:
                  poly:
                    allOf:
                      - type: object
                        required: [baseField]
                        properties:
                          baseField:
                            type: string
                      - type: object
                        required: [extraField]
                        properties:
                          extraField:
                            type: number

  /test/nested:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, tags]
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        description:
                          type: string
                        tags:
                          type: array
                          items:
                            type: string
                        aliases:
                          type: array
                          nullable: true
                          items:
                            type: string
                        metadata:
                          type: object
                          nullable: true
                          required: [creator, version]
                          properties:
                            creator:
                              type: string
                            version:
                              type: number
                  pagination:
                    type: object
                    required: [total]
                    properties:
                      total:
                        type: integer

  /test/formats-extended:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ipv6, byte, int32, int64, float, double]
                properties:
                  ipv6:
                    type: string
                    format: ipv6
                  byte:
                    type: string
                    format: byte
                  int32:
                    type: integer
                    format: int32
                  int64:
                    type: integer
                    format: int64
                  float:
                    type: number
                    format: float
                  double:
                    type: number
                    format: double
        '201':
          description: Created
          content:
            application/json: {}

  /test/formats/no-type/int32:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [field]
                properties:
                  field:
                    format: int32

  /test/formats/no-type/int64:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [field]
                properties:
                  field:
                    format: int64

  /test/formats/no-type/float:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [field]
                properties:
                  field:
                    format: float

  /test/formats/no-type/double:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [field]
                properties:
                  field:
                    format: double

  /test/validation/invalid-minimum:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [field]
                properties:
                  field:
                    type: integer
                    format: int64
                    minimum: 'not-a-number'

  /test/validation/invalid-maximum:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [field]
                properties:
                  field:
                    type: integer
                    format: int64
                    maximum: 'not-a-number'

  /test/validation/invalid-multipleof:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [field]
                properties:
                  field:
                    type: integer
                    format: int64
                    multipleOf: 'not-a-number'

  /test/validation/bigint-constraints:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [field]
                properties:
                  field:
                    type: integer
                    format: int64
                    minimum: 10
                    maximum: 100
                    multipleOf: 5

  /test/validation/write-only:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [field]
                properties:
                  field:
                    type: string
                    writeOnly: true

  /test/validation/nullable:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [field]
                properties:
                  field:
                    type: string
                    nullable: true

  /test/validation/const:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, code]
                properties:
                  status:
                    type: string
                    const: success
                  code:
                    type: integer
                    const: 200

  /test/validation/enum:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [role, level]
                properties:
                  role:
                    type: string
                    enum: [admin, user, guest]
                  level:
                    type: integer
                    enum: [1, 2, 3]

  /test/dynamic/{id}:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string

  /test/polymorphism/ref-object:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [poly]
                properties:
                  poly:
                    anyOf:
                      - $ref: '#/components/schemas/SimpleUser'

  /test/polymorphism/discriminator:
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [poly]
                properties:
                  poly:
                    $ref: '#/components/schemas/Pet'

  /test/polymorphism/discriminator-anyof:
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [poly]
                properties:
                  poly:
                    $ref: '#/components/schemas/Vehicle'

  /test/polymorphism/discriminator-no-mapping:
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [poly]
                properties:
                  poly:
                    $ref: '#/components/schemas/Shape'

components:
  schemas:
    SimpleUser:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Pet:
      type: object
      required: [petType]
      properties:
        petType:
          type: string
      discriminator:
        propertyName: petType
        mapping:
          dog: '#/components/schemas/Dog'
          puppy: '#/components/schemas/Dog'
          cat: '#/components/schemas/Cat'
      oneOf:
        - $ref: '#/components/schemas/Dog'
        - $ref: '#/components/schemas/Cat'

    Dog:
      type: object
      required: [petType, barkVolume]
      properties:
        petType:
          type: string
          const: dog
        barkVolume:
          type: integer

    Cat:
      type: object
      required: [petType, nestsCount]
      properties:
        petType:
          type: string
          const: cat
        nestsCount:
          type: integer

    Vehicle:
      type: object
      required: [vehicleType]
      properties:
        vehicleType:
          type: string
      discriminator:
        propertyName: vehicleType
        mapping:
          car: '#/components/schemas/Car'
          truck: '#/components/schemas/Truck'
      anyOf:
        - $ref: '#/components/schemas/Car'
        - $ref: '#/components/schemas/Truck'

    Car:
      type: object
      required: [vehicleType, doors]
      properties:
        vehicleType:
          type: string
          enum: [car]
        doors:
          type: integer

    Truck:
      type: object
      required: [vehicleType, cargoCapacity]
      properties:
        vehicleType:
          type: string
          enum: [truck]
        cargoCapacity:
          type: number

    Shape:
      type: object
      required: [shape]
      properties:
        shape:
          type: string
      discriminator:
        propertyName: shape
      oneOf:
        - $ref: '#/components/schemas/Circle'
        - $ref: '#/components/schemas/Square'

    Circle:
      type: object
      required: [shape, radius]
      properties:
        shape:
          type: string
          const: Circle
        radius:
          type: number

    Square:
      type: object
      required: [shape, sideLength]
      properties:
        shape:
          type: string
          const: Square
        sideLength:
          type: number
