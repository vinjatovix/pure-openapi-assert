name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run workflow in dry-run mode (runs lints, tests, and version query but skips NPM publication and Git tagging)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Commits
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  validate:
    name: Validate Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm run lint

      - name: Check Circular Dependencies
        run: pnpm run check-circular

      - name: Run Tests with Coverage
        run: pnpm run test:coverage

      - name: Run Build
        run: pnpm run build

      - name: Run Shai-Hulud Integrity Scanner (Warn Only)
        run: |
          curl -fsSL --retry 3 --retry-delay 2 https://raw.githubusercontent.com/vinjatovix/shai-hulud-integrity-scanner/6089d9d0423eda64c4002295d235b317deaca6cc/scan-project.sh > /tmp/scan-project.sh
          chmod +x /tmp/scan-project.sh
          /tmp/scan-project.sh . --warn-only --exclude-dir=".specify" | tee scan_report.txt

      - name: Comment PR on Medium Risk
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if grep -q "MEDIUM RISK" scan_report.txt; then
            REPORT_CONTENT=$(cat scan_report.txt)
            cat << EOF > comment.md
          ### ⚠️ Shai-Hulud Scanner - Warnings Detected
          The pipeline completed successfully, but manual review is required for the following security findings:

          \`\`\`text
          $REPORT_CONTENT
          \`\`\`
          EOF
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse Coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: coverage
        run: |
          COVERAGE=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Create Coverage Badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: feac8a8435ec9adc322d155a51ac5079
          filename: coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.coverage }}%
          valColorRange: ${{ steps.coverage.outputs.coverage }}
          maxColorRange: 100
          minColorRange: 50

  release:
    name: Automated Release
    runs-on: ubuntu-latest
    needs: validate
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Package Version
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Query NPM Registry Version
        id: check_version
        run: |
          VERSION="${{ steps.pkg_version.outputs.version }}"
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "Checking if version $VERSION is already published to NPM..."
          
          # Attempt to query with retry up to 3 times
          PUBLISHED="false"
          for i in {1..3}; do
            echo "Registry query attempt $i..."
            REGISTRY_VERSION=$(pnpm info "$PACKAGE_NAME@$VERSION" version 2>/dev/null || true)
            if [ ! -z "$REGISTRY_VERSION" ] && [ "$REGISTRY_VERSION" = "$VERSION" ]; then
              PUBLISHED="true"
              break
            fi
            if [ $i -lt 3 ]; then
              echo "Version query did not find matching version or timed out. Retrying in 5 seconds..."
              sleep 5
            fi
          done
          
          echo "published=$PUBLISHED" >> $GITHUB_OUTPUT
          echo "Version published status: $PUBLISHED"

      - name: Determine Publication Action
        id: decider
        run: |
          PUBLISHED="${{ steps.check_version.outputs.published }}"
          DRY_RUN="${{ inputs.dry-run || 'false' }}"
          
          if [ "$PUBLISHED" = "true" ]; then
            echo "action=skip" >> $GITHUB_OUTPUT
            echo "Reason: Version ${{ steps.pkg_version.outputs.version }} is already published to NPM."
          elif [ "$DRY_RUN" = "true" ]; then
            echo "action=dry-run" >> $GITHUB_OUTPUT
            echo "Reason: Manual dry-run mode active."
          else
            echo "action=publish" >> $GITHUB_OUTPUT
            echo "Reason: New version ${{ steps.pkg_version.outputs.version }} detected. Proceeding to publish."
          fi

      - name: Publish to NPM
        if: steps.decider.outputs.action == 'publish'
        run: |
          pnpm publish --provenance --no-git-checks

      - name: Create and Push Git Tag
        if: steps.decider.outputs.action == 'publish'
        run: |
          VERSION="v${{ steps.pkg_version.outputs.version }}"
          echo "Configuring git user..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          echo "Creating tag $VERSION..."
          git tag -a "$VERSION" -m "Automated release of $VERSION"
          
          echo "Pushing tag $VERSION..."
          git push origin "$VERSION"

      - name: Log Release Bypass
        if: steps.decider.outputs.action != 'publish'
        run: |
          ACTION="${{ steps.decider.outputs.action }}"
          VERSION="${{ steps.pkg_version.outputs.version }}"
          if [ "$ACTION" = "skip" ]; then
            echo "=== RELEASE SKIPPED ==="
            echo "Version $VERSION is already published on the NPM registry."
          elif [ "$ACTION" = "dry-run" ]; then
            echo "=== DRY-RUN VERIFICATION SUCCESSFUL ==="
            echo "All quality gates and pre-checks passed cleanly."
            echo "Simulated publication of version $VERSION would succeed."
          fi
